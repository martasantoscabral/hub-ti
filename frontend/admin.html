<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Admin — Hub TI</title>

  <link rel="stylesheet" href="./css/style.css">

  <style>
    .admin-container {
      max-width: 760px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .admin-form {
      display: grid;
      gap: 16px;
    }

    .admin-form label {
      display: grid;
      gap: 6px;
    }

    .admin-form input,
    .admin-form textarea,
    .admin-form select {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font: inherit;
    }

    .admin-form textarea {
      min-height: 110px;
      resize: vertical;
    }

    .admin-message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      display: none;
    }

    .admin-message.success {
      display: block;
      background: #DCFCE7;
      color: #166534;
    }

    .admin-message.error {
      display: block;
      background: #FEE2E2;
      color: #991B1B;
    }
  </style>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">
    <h1>⚙️ Administração — Hub TI</h1>

    <a href="index.html" class="home-btn">
      ↩ Início
    </a>
  </div>
</header>

<main class="admin-container">

  <div class="card">
    <h3>Adicionar material</h3>

    <form id="materialForm" class="admin-form">

      <label>
        Ano
        <select id="year" required>
          <option value="">Escolher ano</option>
        </select>
      </label>

      <label>
        Disciplina
        <select id="course" required disabled>
          <option value="">Escolher disciplina</option>
        </select>
      </label>

      <label>
        Título
        <input id="title" type="text" required>
      </label>

      <label>
        Descrição
        <textarea id="description"></textarea>
      </label>

      <label>
        Categoria
        <select id="category" required>
          <option value="RESUMO">Resumo</option>
          <option value="PROJETO">Projeto</option>
          <option value="EXERCICIO">Exercício</option>
          <option value="EXAME">Exame</option>
        </select>
      </label>

      <label>
        Data
        <input id="materialDate" type="date">
      </label>

      <label>
        Link para abrir
        <input id="openUrl" type="url">
      </label>

      <label>
        Link para download
        <input id="downloadUrl" type="url">
      </label>

      <label>
        Tags, separadas por vírgulas
        <input
          id="tags"
          type="text"
          placeholder="exame, resolução, resumo"
        >
      </label>

      <button class="btn primary" type="submit">
        Guardar material
      </button>

    </form>

    <div id="message" class="admin-message"></div>
  </div>

</main>

<script src="./js/config.js"></script>
<script src="./js/api.js"></script>
<script src="./js/admin.js"></script>

</body>
</html>
