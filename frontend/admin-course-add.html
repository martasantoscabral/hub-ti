<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="./js/config.js"></script>
  <script src="./js/admin-auth.js"></script>

  <title>Adicionar disciplina — Hub TI</title>

  <link rel="stylesheet" href="./css/style.css">

  <style>
    .admin-container {
      max-width: 760px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .admin-form {
      display: grid;
      gap: 16px;
    }

    .admin-form label {
      display: grid;
      gap: 6px;
      font-weight: 700;
    }

    .admin-form input,
    .admin-form textarea,
    .admin-form select {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font: inherit;
      background: white;
    }

    .admin-form textarea {
      min-height: 110px;
      resize: vertical;
    }

    .admin-message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      display: none;
    }

    .admin-message.success {
      display: block;
      background: #DCFCE7;
      color: #166534;
    }

    .admin-message.error {
      display: block;
      background: #FEE2E2;
      color: #991B1B;
    }

    .admin-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .admin-actions .btn {
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">
    <h1>➕ Adicionar disciplina</h1>

    <a href="admin.html" class="home-btn">
      ↩ Painel
    </a>
  </div>
</header>

<main class="admin-container">

  <div class="card">
    <h3>Nova disciplina</h3>

    <form id="courseForm" class="admin-form">

      <label>
        Ano
        <select id="academicYear" required>
          <option value="">Escolher ano</option>
        </select>
      </label>

      <label>
        Semestre
        <select id="semester" required>
          <option value="">Escolher semestre</option>
          <option value="1">1.º semestre</option>
          <option value="2">2.º semestre</option>
        </select>
      </label>

      <label>
        Código
        <input
          id="code"
          type="text"
          required
          placeholder="Ex.: si"
        >
      </label>

      <label>
        Nome
        <input
          id="name"
          type="text"
          required
          placeholder="Ex.: Segurança Informática"
        >
      </label>

      <label>
        Descrição
        <textarea
          id="description"
          placeholder="Descrição opcional"
        ></textarea>
      </label>

      <label>
        Cor
        <input
          id="color"
          type="text"
          placeholder="Ex.: #7C3AED"
        >
      </label>

      <div class="admin-actions">
        <button class="btn primary" type="submit">
          Guardar disciplina
        </button>

        <a class="btn" href="admin.html">
          Cancelar
        </a>
      </div>

    </form>

    <div id="message" class="admin-message"></div>
  </div>

</main>

<script src="./js/api.js"></script>
<script src="./js/admin-course-add.js"></script>

</body>
</html>
