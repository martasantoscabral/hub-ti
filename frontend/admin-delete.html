<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="./js/admin-auth.js"></script>
  <title>Eliminar material — Hub TI</title>

  <link rel="stylesheet" href="./css/style.css">

  <style>
    .admin-container {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .admin-form {
      display: grid;
      gap: 16px;
    }

    .admin-form label {
      display: grid;
      gap: 6px;
      font-weight: 700;
    }

    .admin-form input,
    .admin-form select {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font: inherit;
      background: white;
    }

    .materials-card {
      margin-top: 24px;
    }

    .materials-list {
      display: grid;
      gap: 14px;
      margin-top: 18px;
    }

    .material-item {
      padding: 18px;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      background: white;
    }

    .material-item h4 {
      margin: 0 0 8px;
    }

    .material-item p {
      margin: 8px 0 14px;
      line-height: 1.6;
    }

    .material-meta {
      color: var(--ink-2);
      font-size: 13px;
      margin-bottom: 10px;
    }

    .material-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .delete-btn {
      border: none;
      cursor: pointer;
      background: #DC2626;
      color: white;
    }

    .delete-btn:hover {
      background: #B91C1C;
    }

    .delete-btn:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    .admin-message {
      margin-bottom: 18px;
      padding: 12px;
      border-radius: 10px;
      display: none;
    }

    .admin-message.success {
      display: block;
      background: #DCFCE7;
      color: #166534;
    }

    .admin-message.error {
      display: block;
      background: #FEE2E2;
      color: #991B1B;
    }

    .empty-message {
      color: var(--ink-2);
      margin: 0;
    }

    @media (max-width: 600px) {
      .material-actions {
        flex-direction: column;
      }

      .material-actions .btn {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">
    <h1>🗑️ Eliminar material</h1>

    <a href="admin.html" class="home-btn">
      ↩ Painel
    </a>
  </div>
</header>

<main class="admin-container">

  <div id="message" class="admin-message"></div>

  <div class="card">
    <h3>Escolher disciplina</h3>

    <div class="admin-form">
      <label>
        Ano

        <select id="year">
          <option value="">Escolher ano</option>
        </select>
      </label>

      <label>
        Disciplina

        <select id="course" disabled>
          <option value="">Escolher disciplina</option>
        </select>
      </label>

    </div>
  </div>

  <div class="card materials-card">
    <h3>Materiais existentes</h3>

    <div id="materialsList" class="materials-list">
      <p class="empty-message">
        Escolhe um ano e uma disciplina.
      </p>
    </div>
  </div>

</main>

<script src="./js/config.js"></script>
<script src="./js/api.js"></script>
<script src="./js/admin-delete.js"></script>

</body>
</html>
