<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Disciplina — Hub TI 1º Ano</title>
  <link rel="icon" type="image/png" href="./assets/icon.svg" />

  <link rel="stylesheet" href="./css/style.css">
  <style>
    .course-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 13px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      font-family: 'Nunito', sans-serif;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: #fff;
      margin-bottom: 16px;
    }
    .empty-state {
      color: var(--ink-3);
      font-size: 13px;
      padding: 20px 0;
      text-align: center;
      font-style: italic;
    }
  </style>
</head>
<body>

<header class="topbar">
  <div id="sidebarOverlay" class="sidebar-overlay"></div>
  <div class="topbar-inner">
    <button
      id="mobileMenuButton"
      class="mobile-menu-button"
      type="button"
      aria-label="Abrir menu de disciplinas"
      aria-expanded="false"
    > ☰
    </button>

    <h1>📚 Hub Académico — 1.º Ano · TI</h1>
    <a href="index.html" class="home-btn">↩ Início</a>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <h3>Disciplinas</h3>

    <nav id="coursesSidebar">
      <p>A carregar disciplinas...</p>
    </nav>
  </aside>

  <main class="content" id="main-content">

    <!-- Course header – colorido pelo script abaixo -->
    <div class="course-header" id="course-header">
      <div class="course-pill" id="course-pill"></div>
      <h2 id="courseTitle">Carregando…</h2>
      <p id="course-desc"></p>
    </div>

    <!-- Resumos -->
    <div class="card" id="sec-resumos">
      <h3><span style="font-size:18px">📄</span> Resumos</h3>
      <div class="grid" id="resumos"></div>
      <div id="resumosEmpty" class="empty-state" style="display:none">Sem resumos ainda.</div>
    </div>

    <!-- Projetos -->
    <div class="card" id="sec-projetos">
      <h3><span style="font-size:18px">💻</span> Projetos</h3>
      <div class="grid" id="projetos"></div>
      <div id="projetosEmpty" class="empty-state" style="display:none">Sem projetos ainda.</div>
    </div>

    <!-- Exercícios -->
    <div class="card" id="sec-exercicios">
      <h3><span style="font-size:18px">✏️</span> Exercícios</h3>
      <div class="grid" id="exercicios"></div>
      <div id="exerciciosEmpty" class="empty-state" style="display:none">Sem exercícios ainda.</div>
    </div>

  </main>
</div>


<script src="./js/config.js"></script>
<script src="./js/api.js"></script>
<script src="./js/disciplina1-api.js"></script>
<script src="./js/mobile-menu.js"></script>


<script>
  document.addEventListener("DOMContentLoaded", () => {
    const key = new URLSearchParams(location.search).get("course") || "cc";
    const theme = COURSE_THEME[key];
    if (!theme) return;

    const header = document.getElementById("course-header");
    header.classList.add(theme.cls);

    const pill = document.getElementById("course-pill");
    pill.textContent = theme.abbr;
    pill.style.background = theme.color;

    document.getElementById("course-desc").textContent = theme.desc;
    document.getElementById("main-content").style.setProperty("--course-color", theme.color);
  });
</script>

</body>
</html>
